name: Build and deploy .NET 10 API to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Restore
        run: dotnet restore src/CasualBookingSystem.Api/CasualBookingSystem.Api.csproj

      - name: Build
        run: dotnet build src/CasualBookingSystem.Api/CasualBookingSystem.Api.csproj --configuration Release --no-restore

      - name: Publish
        run: dotnet publish src/CasualBookingSystem.Api/CasualBookingSystem.Api.csproj --configuration Release --output ./publish --no-build

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-casual-booking-mayank
          slot-name: Production
          publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
          package: ./publish


name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build_and_deploy_job:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.23.2'

      - name: Install dependencies
        working-directory: ./Casual Booking System - Angular
        run: npm ci

      - name: Build Angular
        working-directory: ./Casual Booking System - Angular
        run: npm run build -- --configuration production

      - name: Deploy Angular
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ICY_MUD_070B25600 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: "./Casual Booking System - Angular/dist/casual-booking-web/browser"
          api_location: ""
          output_location: ""
          skip_app_build: true


name: Build and deploy .NET 10 API to Azure Web App

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Locate API project
        shell: bash
        run: |
          PROJECT_PATH="$(find . -type f -name 'CasualBookingSystem.Api.csproj' -print -quit)"
          if [ -z "$PROJECT_PATH" ]; then
            echo 'ERROR: API project not found.'
            exit 1
          fi
          echo "PROJECT_PATH=$PROJECT_PATH" >> "$GITHUB_ENV"

      - name: Restore API
        run: dotnet restore "$PROJECT_PATH"

      - name: Build API
        run: dotnet build "$PROJECT_PATH" -c Release --no-restore

      - name: Publish API
        run: dotnet publish "$PROJECT_PATH" -c Release -o ./publish --no-restore

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: api-publish
          path: ./publish
          if-no-files-found: error

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download artifact
        uses: actions/download-artifact@v4
        with:
          name: api-publish
          path: ./publish

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_5717ACB01369451AA70B9DF92784FD64 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_C62C258070C44B3891555A20B5C3FA95 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_8654E3643B804823B1AC619B4B7FAB7C }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: api-casual-booking-mayank
          slot-name: Production
          package: ./publish
